[package]
name = "afc"
version = "0.1.0"
edition = "2021"
description = "AppFunctions caller: registry, validation before the call, error translation, binder route"
license = "MIT"

# No dependencies: the binary has to run statically on the device and must be
# buildable without network access (the sandbox has no crates.io).
[dependencies]

[[bin]]
name = "afc"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
